name: Deploy isolated preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify strict preview isolation
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies?.firebase || p.dependencies?.express || p.dependencies?.dotenv) process.exit(1); console.log('Isolation check passed: no production backend dependencies');"

      - name: Run type check
        run: npm run lint

      - name: Run calendar duration sync unit tests (11 mandatory cases)
        run: npm test

      - name: Build static preview
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
